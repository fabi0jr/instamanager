# Produção: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# TLS e roteamento: Traefik da VPS (rede externa infra-network), por labels do serviço web.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    networks: [interna]
    volumes:
      - db-data:/var/lib/postgresql/data
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  back:
    build: { context: ., dockerfile: back/Dockerfile }
    restart: unless-stopped
    networks: [interna]
    depends_on:
      db: { condition: service_healthy }
    # log rotativo para ninguém encher o disco
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    volumes:
      - uploads:/var/uploads
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HOST: 0.0.0.0
      PORT: 3000
      UPLOADS_DIR: /var/uploads
      APP_URL: ${APP_URL:?defina APP_URL no .env}
      TRUST_PROXY: 1
      INVITE_CODE: ${INVITE_CODE:?defina INVITE_CODE no .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?defina ADMIN_EMAIL no .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}

  web:
    build: { context: ., dockerfile: front/Dockerfile }
    restart: unless-stopped
    depends_on:
      back: { condition: service_healthy }
    networks: [interna, infra-network]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    volumes:
      - uploads:/var/uploads:ro
    labels:
      traefik.enable: "true"
      traefik.docker.network: infra-network
      traefik.http.routers.instamanager.rule: Host(`instamanager.fj-dev.tech`)
      traefik.http.routers.instamanager.tls.certresolver: letsencrypt
      traefik.http.services.instamanager.loadbalancer.server.port: "8080"

networks:
  interna:
  infra-network:
    external: true

volumes:
  db-data:
  uploads:
