server {
  listen 8080;
  root /usr/share/nginx/html;
  # posts chegam como multipart com até 10 imagens de ≤ 3 MB (cheia + mini)
  client_max_body_size 40m;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://back:3000;
    proxy_set_header Host $host;
    # repassa o XFF do proxy da VPS sem acrescentar o nosso (o back enxerga o IP do cliente, não o do nginx)
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_hide_header Referrer-Policy;
    include /etc/nginx/snippets/seguranca.conf;
  }

  # fotos enviadas: volume do back montado em /var/uploads; nome único por arquivo, então o cache pode ser eterno
  location /uploads/ {
    alias /var/uploads/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/seguranca.conf;
  }

  # arquivos com hash no nome (assets) ou que não mudam (fontes)
  location ~ ^/(assets|fonts)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/seguranca.conf;
  }

  # SPA; sw.js e manifest sempre revalidados para o app atualizar
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/seguranca.conf;
  }
}
