# Robôs de prévia de link (WhatsApp, Telegram...). Pessoas continuam recebendo o app.
map $http_user_agent $robo_previa {
  default 0;
  "~*(WhatsApp|facebookexternalhit|Twitterbot|TelegramBot|Slackbot|Discordbot|LinkedInBot)" 1;
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  # posts chegam como multipart com até 10 imagens de ≤ 3 MB (cheia + mini)
  client_max_body_size 40m;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  # envio de story e de post (imagem ou vídeo de até 60 MB): 64 MB só aqui; o resto da API segue com o limite de cima.
  # A conversão do vídeo (até 90 s no back) acontece dentro do pedido, então o proxy espera mais que os 60 s padrão.
  location ~ ^/api/(stories(/.*)?|posts/?)$ {
    client_max_body_size 64m;
    proxy_read_timeout 120s;
    proxy_pass http://back:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_hide_header Referrer-Policy;
    include /etc/nginx/snippets/seguranca.conf;
  }

  location /api/ {
    proxy_pass http://back:3000;
    proxy_set_header Host $host;
    # repassa o XFF do proxy da VPS sem acrescentar o nosso (o back enxerga o IP do cliente, não o do nginx)
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_hide_header Referrer-Policy;
    include /etc/nginx/snippets/seguranca.conf;
  }

  # fotos enviadas: volume do back montado em /var/uploads; nome único por arquivo, então o cache pode ser eterno
  location /uploads/ {
    alias /var/uploads/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/seguranca.conf;
  }

  # arquivos com hash no nome (assets) ou que não mudam (fontes)
  location ~ ^/(assets|fonts)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/seguranca.conf;
  }

  # `types {}` substituiria o mime.types inteiro; aqui só este arquivo ganha o tipo certo
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/seguranca.conf;
  }

  # o app confere esta versão ao abrir e ao voltar ao primeiro plano: nunca pode vir de cache
  location = /version.json {
    default_type application/json;
    add_header Cache-Control "no-store";
    include /etc/nginx/snippets/seguranca.conf;
  }

  # /p/<uuid>: robô de prévia vai para o HTML com as tags og: do back; qualquer outro cliente recebe a SPA
  location ~* "^/p/(?<postid>[0-9a-f-]{36})$" {
    if ($robo_previa) {
      rewrite ^ /api/og/p/$postid last;
    }
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
    add_header Vary "User-Agent"; # a mesma URL responde diferente para robô e para pessoa
    include /etc/nginx/snippets/seguranca.conf;
  }

  # SPA; sw.js e manifest sempre revalidados para o app atualizar
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/seguranca.conf;
  }
}
